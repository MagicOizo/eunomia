name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # Real MariaDB so the migration integration test actually runs in CI
      # (it skips when these DB_* env vars are absent, e.g. on a dev machine).
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eunomia_test
          MARIADB_USER: eunomia
          MARIADB_PASSWORD: eunomia
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: eunomia
      DB_PASSWORD: eunomia
      DB_NAME: eunomia_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The dependencies that reach a browser or the production image, checked
      # on the push that introduced them instead of at the next review. Dev
      # tooling is omitted (it never ships), and only high/critical fails the
      # build — a moderate advisory in a transitive package must not stop a
      # hotfix from being merged. `npm audit fix` is usually the whole answer.
      - run: npm audit --omit=dev --audit-level=high

      # Catches version drift between the workspaces, the lockfile and
      # CHANGELOG.md on the push that caused it, not at tagging time.
      - run: npm run version:check

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
