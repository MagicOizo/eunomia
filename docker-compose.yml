services:
  api:
    # Pre-built, versioned image from GitHub Container Registry — a production
    # host only needs this file + .env (no source checkout, no build). Pin a
    # release with EUNOMIA_VERSION in .env; defaults to the latest release.
    # To build locally instead, add docker-compose.build.yml (see DEV.md).
    image: ghcr.io/magicoizo/eunomia:${EUNOMIA_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Everything below is optional and passed through as `${VAR:-}` on
      # purpose: an empty value counts as "unset" in config/env.ts, so the
      # application's own default applies and the defaults are not duplicated
      # here, where they would silently drift out of step.
      #
      # A variable only reaches the container if it is listed in this block —
      # having it in .env is not enough. Anything documented in .env.example
      # belongs here too.
      TRUST_PROXY: ${TRUST_PROXY:-}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-}
      RATE_LIMIT_GLOBAL_WINDOW_MS: ${RATE_LIMIT_GLOBAL_WINDOW_MS:-}
      UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-}
      UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-}
      UPDATE_CHECK_TOKEN: ${UPDATE_CHECK_TOKEN:-}
      UPDATE_CHECK_TTL_SECONDS: ${UPDATE_CHECK_TTL_SECONDS:-}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
    # Bound to the loopback interface by default: with a reverse proxy on this
    # host in front (the documented setup), anything reachable on another
    # interface would be reachable past the proxy — and so past its TLS and its
    # access rules. Set BIND_ADDRESS=0.0.0.0 in .env to publish the app on the
    # network without a proxy (see README, "Deploy").
    #
    # PORT is on both sides because it is also passed into the container above:
    # the app (and its health check) listen on it, so a PORT other than 3000
    # would otherwise be published onto a port nothing answers on.
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}'
    depends_on:
      db:
        condition: service_healthy
    # The container never writes to its filesystem: the API logs to stdout and
    # the backup/restore scripts stream through STDOUT/STDIN. /tmp is a tmpfs so
    # the mariadb client has scratch space if it ever wants it.
    read_only: true
    tmpfs:
      - /tmp
    # Node listens on 3000 and runs as eunomia:nodejs, so it needs no
    # capability at all, and nothing in the image is setuid.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # So a runaway in here cannot take the host with it. Raise these if your
    # host is larger; the app itself is comfortable well below them.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      # Bootstrapped from the same DB_* values the API connects with — defined
      # once in .env, no duplicate credentials.
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # Nothing ever connects as root — the API, migrations and the backup/
      # restore scripts all use DB_USER, which has ALL privileges on its own
      # database — so root gets a throwaway random password no human needs.
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    # No 'ports:' mapping on purpose — the database must not be reachable
    # from outside the compose network, only from the api container (see
    # Notes/eunomia-plan.md, 2.1).
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # Deliberately without `read_only` and `cap_drop` — unlike the api image,
    # the mariadb entrypoint chowns its data directory and drops to the mysql
    # user on first start, which needs both a writable filesystem and the
    # capabilities for it.
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

volumes:
  db_data:
