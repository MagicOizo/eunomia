services:
  api:
    # Pre-built, versioned image from GitHub Container Registry — a production
    # host only needs this file + .env (no source checkout, no build). Pin a
    # release with EUNOMIA_VERSION in .env; defaults to the latest release.
    # To build locally instead, add docker-compose.build.yml (see DEV.md).
    image: ghcr.io/magicoizo/eunomia:${EUNOMIA_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      # Bootstrapped from the same DB_* values the API connects with — defined
      # once in .env, no duplicate credentials.
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # Nothing ever connects as root — the API, migrations and the backup/
      # restore scripts all use DB_USER, which has ALL privileges on its own
      # database — so root gets a throwaway random password no human needs.
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    # No 'ports:' mapping on purpose — the database must not be reachable
    # from outside the compose network, only from the api container (see
    # Notes/eunomia-plan.md, 2.1).
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
